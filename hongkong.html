<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hong Kong Trip Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --bg: #f6f5f2;
    --panel: #ffffff;
    --text: #1d1d1f;
    --muted: #6b6b70;
    --line: #e4e2dd;
    --accent: #c8102e;
    --chip: #efede8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141416; --panel: #1c1c1f; --text: #f2f2f2; --muted: #9a9aa0;
      --line: #2e2e33; --accent: #ff4d5e; --chip: #2a2a2f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141416; --panel: #1c1c1f; --text: #f2f2f2; --muted: #9a9aa0;
    --line: #2e2e33; --accent: #ff4d5e; --chip: #2a2a2f;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    display: grid; grid-template-columns: 380px 1fr; height: 100vh;
  }

  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  header { padding: 18px 16px 12px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 20px; letter-spacing: -0.01em; }
  h1 small { font-weight: 500; color: var(--muted); font-size: 14px; margin-left: 6px; }
  .progress { margin-top: 6px; color: var(--muted); font-size: 13px; }
  .bar { height: 4px; background: var(--chip); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }

  .controls { padding: 12px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
  input[type=search] {
    width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid transparent; background: var(--chip); color: var(--text);
    padding: 5px 10px; border-radius: 999px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .row label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .btn {
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    padding: 6px 10px; border-radius: 8px; font: inherit; font-size: 13px; cursor: pointer;
  }

  #list { overflow-y: auto; flex: 1; padding: 4px 0 24px; }
  .group h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 16px 6px; }
  .item { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; padding: 8px 16px; cursor: pointer; align-items: center; }
  .thumb { position: relative; width: 56px; height: 56px; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; display: block; background: var(--chip); }
  .thumb span {
    position: absolute; right: -4px; bottom: -4px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--panel); display: grid; place-items: center; font-size: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.25);
  }
  .item .dot { margin: 0 auto; }
  .item.done .thumb img { filter: grayscale(1); opacity: .6; }
  .credit { padding: 8px 16px 16px; font-size: 11px; color: var(--muted); }
  .item:hover { background: var(--bg); }
  .item .dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; background: var(--c); }
  .item b { display: block; font-weight: 600; }
  .item .sub { color: var(--muted); font-size: 12.5px; }
  .item.done b { text-decoration: line-through; color: var(--muted); }
  .item input { margin-top: 6px; width: 17px; height: 17px; accent-color: var(--accent); }

  #map { height: 100%; min-height: 0; }

  .pin {
    width: 30px; height: 30px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
    background: var(--c); border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35);
    display: grid; place-items: center;
  }
  .pin span { transform: rotate(45deg); font-size: 14px; }
  .pin.done { filter: grayscale(1); opacity: .6; }
  .pin.big { width: 58px; height: 58px; border-width: 3px; }
  .pin.big span { font-size: 22px; }
  .pin.big img { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; transform: rotate(45deg); border: 2px solid #fff; box-sizing: border-box; }
  .leaflet-tooltip.lbl {
    background: transparent; border: 0; box-shadow: none; padding: 0;
    font-weight: 600; font-size: 12px; color: #222;
    text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff;
  }
  .leaflet-tooltip.lbl::before { display: none; }
  .hide-labels .leaflet-tooltip.lbl:not(.keep) { display: none; }
  .leaflet-tooltip.lbl.keep { font-size: 13px; }
  .region, .district, .water { pointer-events: none; white-space: nowrap; }
  .region > div, .district > div, .water > div { transform: translate(-50%, -50%); }
  .region {
    font-weight: 700; font-size: 13px; letter-spacing: .14em; color: #8a8f98; text-align: center;
    text-shadow: 0 0 3px #fff, 0 0 3px #fff;
  }
  .region small { display: block; font-size: 11px; letter-spacing: .1em; font-weight: 500; }
  .district { font-size: 11.5px; font-weight: 600; color: #9aa0a8; text-shadow: 0 0 3px #fff, 0 0 3px #fff; }
  .water { font-size: 12px; font-style: italic; color: #7fa7c9; letter-spacing: .05em; }

  .pop .photo { display: block; width: 100%; height: 150px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; background: #eee; }
  .pop h3 { margin: 0 0 2px; font-size: 15px; }
  .pop .zh { color: #777; font-size: 13px; }
  .pop p { margin: 8px 0; }
  .pop .meta { font-size: 12px; color: #555; }
  .pop .links { display: flex; gap: 6px; margin-top: 8px; }
  .pop .links a {
    flex: 1; text-align: center; padding: 6px 8px; border-radius: 8px; text-decoration: none;
    background: #1a73e8; color: #fff; font-weight: 600; font-size: 12px;
  }
  .pop .links a.alt { background: #eef3fd; color: #1a73e8; }

  #toggle { display: none; }

  .full-btn { display: grid !important; place-items: center; color: #333 !important; }
  body.map-full { overflow: hidden; }
  body.map-full #map { position: fixed; inset: 0; width: auto; height: auto; z-index: 1000; box-shadow: none; }

  /* Điện thoại: cả trang cuộn bình thường, bản đồ dính ở trên, danh sách cuộn bên dưới */
  @media (max-width: 768px) {
    html, body { height: auto; }
    body { display: flex; flex-direction: column; }
    #map {
      order: -1; flex: none;
      position: sticky; top: 0; z-index: 2;
      height: 45vh; height: 45svh;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    aside { border-right: 0; min-height: 0; }
    header { padding: 12px 16px 8px; }
    .controls { padding: 10px 16px; gap: 8px; }
    .chips { flex-wrap: nowrap; overflow-x: auto; margin: 0 -16px; padding: 0 16px 2px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: none; }
    #list { overflow: visible; padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
    .pop .photo { height: 100px; }
    .pop p { margin: 6px 0; }
  }
</style>
</head>

    note: "Bánh trứng gà non (雞蛋仔 – bubble waffle) nổi tiếng, gốc từ North Point (492 King's Road). Chi nhánh 178 Nathan Road (TST) này cách hostel ~600 m. Ăn liền lúc vừa ra lò mới giòn. Thay thế: Mammy Pancake ở bến Star Ferry TST.", time: "Bất kỳ", mtr: "Tsim Sha Tsui / Jordan",
    url: "https://www.google.com/maps/search/?api=1&query=%E5%88%A9%E5%BC%B7%E8%A8%98%E5%8C%97%E8%A7%92%E9%9B%9E%E8%9B%8B%E4%BB%94+178+Nathan+Road" },
  { cat: "cafe", name: "Heartwarming (Black Sesame)", zh: "暖心芝作", lat: 22.3258, lng: 114.1668, area: "Prince Edward / Mong Kok",
    note: "Chuyên đồ mè đen. Món viral là kem tươi mè đen (soft serve), ngoài ra có pudding mè đen, bánh cuộn mè đen và sữa đậu nành mè đen không đường. Hay phải xếp hàng. Chi nhánh 23 Yu Chau Street (汝州街), gần Hung Wan và Sham Shui Po. Chi nhánh khác: 50 Electric Road, Tin Hau.", time: "Chiều", mtr: "Prince Edward",
    url: "https://www.google.com/maps/search/?api=1&query=%E6%9A%96%E5%BF%83%E8%8A%9D%E4%BD%9C+%E6%B1%9D%E5%B7%9E%E8%A1%97+23" },
  { cat: "cafe", name: "Hung Wan Cafe", zh: "鴻運冰廳餅店", lat: 22.3225, lng: 114.1675, area: "Mong Kok",
    note: "Băng sảnh kiêm tiệm bánh cũ từ 1977. Bánh mì, bánh tart dừa, bánh bơ ra lò mỗi ngày, ăn kèm trà sữa kiểu HK. Địa chỉ: 726 Shanghai Street.", time: "Sáng / trưa", mtr: "Prince Edward / Mong Kok",
    url: "https://www.google.com/maps/search/?api=1&query=%E9%B4%BB%E9%81%8B%E5%86%B0%E5%BB%B3%E9%A4%85%E5%BA%97+726+Shanghai+Street",
    img: "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8a/HK_YTM_MK_%E6%97%BA%E8%A7%92_Mong_Kok_%E4%B8%8A%E6%B5%B7%E8%A1%97_729_Shanghai_Street_%E9%B4%BB%E9%81%8B%E5%86%B0%E5%BB%B3%E9%A4%85%E5%BA%97_Hung_Wan_Cafe_%26_Bakery_February_2023_Px3_01.jpg/960px-HK_YTM_MK_%E6%97%BA%E8%A7%92_Mong_Kok_%E4%B8%8A%E6%B5%B7%E8%A1%97_729_Shanghai_Street_%E9%B4%BB%E9%81%8B%E5%86%B0%E5%BB%B3%E9%A4%85%E5%BA%97_Hung_Wan_Cafe_%26_Bakery_February_2023_Px3_01.jpg" },

  // --- Giải trí ---
  { cat: "fun", name: "Hong Kong Disneyland", zh: "香港迪士尼樂園", lat: 22.3129, lng: 114.0413, area: "Lantau",
    note: "Có World of Frozen độc quyền. Cả ngày.", time: "Cả ngày", mtr: "Disneyland Resort",

  { cat: "fun", name: "Ocean Park", zh: "海洋公園", lat: 22.2466, lng: 114.1758, area: "Aberdeen",
    note: "Công viên giải trí + thuỷ cung, cáp treo nhìn ra biển, có gấu trúc.", time: "Cả ngày", mtr: "Ocean Park",
    img: "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0b/Ocean_Park_Hong_Kong.jpg/960px-Ocean_Park_Hong_Kong.jpg" },

  // --- Lưu trú & di chuyển (thêm khách sạn của mày vào đây) ---
  { cat: "stay", name: "Sân bay HKIA", zh: "香港國際機場", lat: 22.3080, lng: 113.9185, area: "Chek Lap Kok",
    note: "Airport Express → Hong Kong station ~24 phút. Mua thẻ Octopus ngay ở sân bay, dùng cho MTR, bus, 7-Eleven.", time: "", mtr: "Airport Express",
    img: "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7c/Hong_Kong_International_Airport_Terminal_2.jpg/960px-Hong_Kong_International_Airport_Terminal_2.jpg" },
  { cat: "stay", name: "AMU Dreamhouse", zh: "Hostel", lat: 22.2979, lng: 114.1753, area: "Tsim Sha Tsui",
    note: "Chỗ ở. Từ sân bay: bus A21 đi thẳng về Nathan Rd (TST) ~1 tiếng, hoặc Airport Express → Kowloon rồi taxi ngắn.", time: "", mtr: "Tsim Sha Tsui / East TST",
    url: "https://maps.app.goo.gl/wX2rtSgDJ4HtQk5r9" },
  // Thêm điểm: { cat: "...", name: "", zh: "", lat: 22.xxx, lng: 114.xxx, area: "", note: "", time: "", mtr: "", url: "link Google Maps (tuỳ chọn)", img: "link ảnh (tuỳ chọn)" },
];
// ============================================================

const store = {
  get() { try { return JSON.parse(localStorage.getItem("visited:" + TRIP_KEY)) || {}; } catch { return {}; } },
  set(v) { try { localStorage.setItem("visited:" + TRIP_KEY, JSON.stringify(v)); } catch {} },
};
let visited = store.get();
const activeCats = new Set(); // rỗng = hiện tất cả
const idOf = p => p.name;

const isPhone = () => matchMedia("(max-width: 768px)").matches;
const map = L.map("map", { zoomControl: true, maxZoom: 16 });
map.fitBounds(L.latLngBounds(PLACES.map(p => [p.lat, p.lng])), { padding: [24, 24] });
// Nền xám trơn, chỉ để biết điểm nằm phía nào. Tile từ zoom 15 trở lên có tên đường
// nên giữ ở 14 rồi phóng to.
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
  maxNativeZoom: 14, maxZoom: 16,
  attribution: "Tiles &copy; Esri",
}).addTo(map);

// Nút xem bản đồ toàn màn hình (làm bằng CSS vì iPhone Safari không hỗ trợ Fullscreen API cho div)
const ICON_EXPAND = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>`;
const ICON_SHRINK = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>`;
let fullBtn;
const FullControl = L.Control.extend({
  options: { position: "topright" },
  onAdd() {
    const bar = L.DomUtil.create("div", "leaflet-bar");
    fullBtn = L.DomUtil.create("a", "full-btn", bar);
    fullBtn.href = "#";
    fullBtn.setAttribute("role", "button");
    L.DomEvent.disableClickPropagation(bar);
    L.DomEvent.on(fullBtn, "click", e => {
      L.DomEvent.preventDefault(e);
      setFull(!document.body.classList.contains("map-full"));
    });
    return bar;
  },
});
map.addControl(new FullControl());

function setFull(on) {
  document.body.classList.toggle("map-full", on);
  fullBtn.innerHTML = on ? ICON_SHRINK : ICON_EXPAND;
  fullBtn.title = on ? "Thu nhỏ bản đồ" : "Xem toàn màn hình";
  map.invalidateSize();
}
setFull(false);
document.addEventListener("keydown", e => { if (e.key === "Escape") setFull(false); });

// Nhãn khu vực tự đặt: vùng lớn luôn hiện, khu nhỏ hiện khi zoom gần
const REGIONS = [
  ["HONG KONG ISLAND", "香港島", 22.252, 114.185],
  ["KOWLOON", "九龍", 22.325, 114.180],
  ["NEW TERRITORIES", "新界", 22.410, 114.130],
  ["LANTAU ISLAND", "大嶼山", 22.265, 113.960],
];
const DISTRICTS = [
  ["Central", 22.281, 114.158], ["Sheung Wan", 22.2865, 114.149], ["Wan Chai", 22.276, 114.173],
  ["Causeway Bay", 22.281, 114.186], ["Quarry Bay", 22.287, 114.216], ["The Peak", 22.266, 114.152],
  ["Aberdeen", 22.249, 114.156], ["Stanley", 22.215, 114.214], ["Kennedy Town", 22.280, 114.128],
  ["Tsim Sha Tsui", 22.298, 114.173], ["Jordan", 22.305, 114.172], ["Mong Kok", 22.319, 114.168],
  ["Sham Shui Po", 22.331, 114.160], ["West Kowloon", 22.304, 114.158], ["Wong Tai Sin", 22.344, 114.196],
  ["Sai Kung", 22.384, 114.275], ["Tung Chung", 22.287, 113.945],
];
const areaLabel = (html, cls, lat, lng) =>
  L.marker([lat, lng], { interactive: false, keyboard: false, icon: L.divIcon({ className: cls, html: `<div>${html}</div>`, iconSize: null }) });
const regionLayer = L.layerGroup(REGIONS.map(([en, zh, lat, lng]) =>
  areaLabel(`${en}<small>${zh}</small>`, "region", lat, lng))).addTo(map);
const districtLayer = L.layerGroup(DISTRICTS.map(([n, lat, lng]) => areaLabel(n, "district", lat, lng)));
areaLabel("Victoria Harbour", "water", 22.291, 114.185).addTo(map);

const gmaps = p => p.url || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name + " Hong Kong")}`;
const gdir  = p => `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`;

// zoom từ mức này trở lên thì ghim to ra và hiện ảnh bên trong
const PHOTO_ZOOM = 14;
const isBig = () => map.getZoom() >= PHOTO_ZOOM;
const labelOffset = big => big ? [34, -41] : [12, -21];

const markers = new Map();
PLACES.forEach(p => {
  const c = CATEGORIES[p.cat];
  const m = L.marker([p.lat, p.lng], { icon: pinIcon(p) })
    .bindTooltip(p.name, { permanent: true, direction: "right", offset: labelOffset(isBig()), className: p.cat === "stay" ? "lbl keep" : "lbl" })
    .bindPopup(`<div class="pop">
      ${p.img ? `<img class="photo" src="${p.img}" alt="">` : ""}
      <h3>${c.emoji} ${p.name}</h3>
      <div class="zh">${p.zh || ""}${p.area ? " · " + p.area : ""}</div>
      <p>${p.note || ""}</p>
      <div class="meta">${p.time ? "🕒 " + p.time : ""}${p.time && p.mtr ? " &nbsp;·&nbsp; " : ""}${p.mtr ? "🚇 " + p.mtr : ""}</div>
      <div class="links"><a href="${gmaps(p)}" target="_blank" rel="noopener">Google Maps</a><a class="alt" href="${gdir(p)}" target="_blank" rel="noopener">Chỉ đường</a></div>
    </div>`, { maxWidth: 280, minWidth: 260 });
  markers.set(idOf(p), m);
});

function pinIcon(p) {
  const c = CATEGORIES[p.cat];
  const big = isBig(), s = big ? 58 : 30;
  const inner = big && p.img ? `<img src="${p.img}" alt="" loading="lazy">` : `<span>${c.emoji}</span>`;
  return L.divIcon({
    className: "",
    html: `<div class="pin ${big ? "big" : ""} ${visited[idOf(p)] ? "done" : ""}" style="--c:${c.color}">${inner}</div>`,
    // ghim là hình vuông xoay 45°, mũi nhọn nằm dưới tâm s/√2
    iconSize: [s, s], iconAnchor: [s / 2, Math.round(s * 1.207)], popupAnchor: [0, -s],
  });
}

let pinsBig = false;
function updatePins() {
  if (isBig() === pinsBig) return;
  pinsBig = isBig();
  markers.forEach((m, id) => {
    m.setIcon(pinIcon(PLACES.find(p => idOf(p) === id)));
    m.getTooltip().options.offset = labelOffset(pinsBig);
    m.getTooltip().update();
  });
}

function updateLabels() {
  const z = map.getZoom();
  map.getContainer().classList.toggle("hide-labels", z < (isPhone() ? 15 : 13));
  z >= 13 ? districtLayer.addTo(map) : districtLayer.remove();
}
map.on("zoomend", updateLabels);
map.on("zoomend", updatePins);
updateLabels();

// --- sidebar ---
const $ = id => document.getElementById(id);

$("chips").innerHTML = `<button class="chip" data-cat="">Tất cả</button>` +
  Object.entries(CATEGORIES).map(([k, c]) =>
    `<button class="chip" data-cat="${k}">${c.emoji} ${c.label}</button>`).join("");
$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  const k = b.dataset.cat;
  if (!k) activeCats.clear();
  else activeCats.has(k) ? activeCats.delete(k) : activeCats.add(k);
  render();
});
$("q").addEventListener("input", render);
$("hideDone").addEventListener("change", render);

function matches(p) {
  const q = $("q").value.trim().toLowerCase();
  if (activeCats.size && !activeCats.has(p.cat)) return false;
  if ($("hideDone").checked && visited[idOf(p)]) return false;
  if (!q) return true;
  return [p.name, p.zh, p.area, p.note, p.mtr].join(" ").toLowerCase().includes(q);
}

function render() {
  document.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed",
    b.dataset.cat ? activeCats.has(b.dataset.cat) : activeCats.size === 0));
  const shown = PLACES.filter(matches);
  markers.forEach((m, id) => {
    const p = PLACES.find(x => idOf(x) === id);
    shown.includes(p) ? m.addTo(map) : m.remove();
  });

  $("list").innerHTML = Object.entries(CATEGORIES).map(([k, c]) => {
    const items = shown.filter(p => p.cat === k);
    if (!items.length) return "";
    return `<div class="group"><h2>${c.emoji} ${c.label} · ${items.length}</h2>${items.map(p => `
      <div class="item ${visited[idOf(p)] ? "done" : ""}" data-id="${idOf(p)}">
        ${p.img
          ? `<div class="thumb"><img src="${p.img}" alt="" loading="lazy"><span>${c.emoji}</span></div>`
          : `<div class="dot" style="--c:${c.color}33">${c.emoji}</div>`}
        <div><b>${p.name}</b><div class="sub">${p.zh || ""}${p.area ? " · " + p.area : ""}</div></div>
        <input type="checkbox" title="Đã đi" ${visited[idOf(p)] ? "checked" : ""}>
      </div>`).join("")}</div>`;
  }).join("") || `<p style="padding:16px;color:var(--muted)">Không có địa điểm nào khớp.</p>`;
  $("list").insertAdjacentHTML("beforeend", `<div class="credit">Ảnh: Wikipedia / Wikimedia Commons</div>`);

  const done = PLACES.filter(p => visited[idOf(p)]).length;
  $("progress").textContent = `${PLACES.length} địa điểm · đã đi ${done}`;
  $("bar").style.width = (done / PLACES.length * 100) + "%";
}

$("list").addEventListener("click", e => {
  const row = e.target.closest(".item"); if (!row) return;
  const id = row.dataset.id;
  if (e.target.matches("input[type=checkbox]")) {
    e.target.checked ? (visited[id] = true) : delete visited[id];
    store.set(visited);
    markers.get(id).setIcon(pinIcon(PLACES.find(p => idOf(p) === id)));
    render();
    return;
  }
  const m = markers.get(id);
  map.flyTo(m.getLatLng(), Math.max(map.getZoom(), 15), { duration: 0.6 });
  map.once("moveend", () => m.openPopup());
});

// --- export KML để import vào Google My Maps ---
$("kml").addEventListener("click", () => {
  const esc = s => String(s || "").replace(/[<>&]/g, ch => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[ch]));
  const folders = Object.entries(CATEGORIES).map(([k, c]) => {
    const pts = PLACES.filter(p => p.cat === k);
    if (!pts.length) return "";
    return `<Folder><name>${esc(c.emoji + " " + c.label)}</name>${pts.map(p => `
      <Placemark><name>${esc(p.name)}</name>
        <description>${esc([p.zh, p.note, p.time && "Giờ đẹp: " + p.time, p.mtr && "MTR: " + p.mtr].filter(Boolean).join("\n"))}</description>
        <Point><coordinates>${p.lng},${p.lat},0</coordinates></Point></Placemark>`).join("")}</Folder>`;
  }).join("");
  const kml = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Hong Kong</name>${folders}</Document></kml>`;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([kml], { type: "application/vnd.google-earth.kml+xml" }));
  a.download = "hongkong.kml";
  a.click();
  URL.revokeObjectURL(a.href);
});

render();
</script>
</body>
</html>
